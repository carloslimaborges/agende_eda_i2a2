[project]
name = "agente-eda-llm-memory"
version = "0.5.0"
description = "Agente EDA com Q&A em LLM (OpenAI/Groq/Gemini) e memória"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit==1.38.0",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "matplotlib>=3.8.4",
  "scikit-learn>=1.4.2",
  "openai>=1.43.0",
  "groq>=0.9.0",
  "google-generativeai>=0.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agente_eda*"]

[tool.uv]
managed = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
